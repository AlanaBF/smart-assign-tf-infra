#########################
# Triggers.
#########################
trigger:
  - main

#########################
# Variables.
#########################
variables:
  - name: tfWorkingDir
    value: infra
  - name: serviceConnection
    value: UKDDC_Azure_Subscription

#########################
# Resources.
#########################
resources:
  repositories:
    - repository: templates
      type: git
      name: 'Azure Capability Deployment Tools/ado-yaml-templates'
      ref: main    

#########################
# Terraform.
#########################
stages:
  - template: terraform/steps/tf-plan.yml@templates
    parameters:
          environment: dev
          location: uks
          workingDirectory: $(tfWorkingDir)
          serviceConnection: $(serviceConnection)
          tfStateServiceConnection: $(serviceConnection)
          tfStateLocation: uks
          tfStateResourceGroupName: alana-barrett-frew-sandbox-rg
          tfStateStorageAccountName: smartassignstoragetf ## create storage ac
          tfStateContainerName: tfstate     ## create storage ac container 
            

  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main' ) }}:
        - template: terraform/steps/tf-apply.yml@templates
          parameters:
            environment: dev
            location: uks
            workingDirectory: $(tfWorkingDir)
            serviceConnection: $(serviceConnection)
            tfStateServiceConnection: $(serviceConnection)
            tfStateLocation: uks
            tfStateResourceGroupName: alana-barrett-frew-sandbox-rg
            tfStateStorageAccountName: smartassignstoragetf ## create storage ac
            tfStateContainerName: tfstate     ## create storage ac container                