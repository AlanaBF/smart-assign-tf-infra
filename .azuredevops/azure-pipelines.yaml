trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: tfWorkingDir
    value: infra
  - name: serviceConnection
    value: Azure subscription
  - name: tfVersion
    value: '1.8.5'

stages:
- stage: TerraformPlan
  displayName: Terraform Plan
  jobs:
  - job: Plan
    displayName: Terraform Plan
    steps:
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: $(tfVersion)

    - task: AzureCLI@2
      displayName: Terraform Init and Plan
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_OIDC_TOKEN=$idToken
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_USE_OIDC=true
          cd $(tfWorkingDir)
          terraform init \
            -backend-config="resource_group_name=alana-barrett-frew-sandbox-rg" \
            -backend-config="storage_account_name=smartassignstoragetf" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=smart-assign.tfstate"
          terraform plan \
            -var-file="vars/global/global.tfvars" \
            -var-file="vars/global/uks/dev.tfvars" \
            -var="db_password=$(DB_PASSWORD)" \
            -out=tfplan

    - task: PublishBuildArtifacts@1
      displayName: Publish Plan
      inputs:
        pathToPublish: '$(tfWorkingDir)/tfplan'
        artifactName: 'tfplan'

- stage: TerraformApply
  displayName: Terraform Apply
  dependsOn: TerraformPlan
  condition: succeeded()
  jobs:
  - job: Apply
    displayName: Terraform Apply
    steps:
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: $(tfVersion)

    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'tfplan'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: AzureCLI@2
      displayName: Terraform Init and Apply
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_OIDC_TOKEN=$idToken
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_USE_OIDC=true
          cd $(tfWorkingDir)
          terraform init \
            -backend-config="resource_group_name=alana-barrett-frew-sandbox-rg" \
            -backend-config="storage_account_name=smartassignstoragetf" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=smart-assign.tfstate"
          terraform apply -auto-approve $(System.ArtifactsDirectory)/tfplan/tfplan
